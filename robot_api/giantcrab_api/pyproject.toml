[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giantcrab-joint-api"
version = "1.0.0"
description = "巨蟹关节电机纯 Python 控制库"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Robot Team"}
]
keywords = ["robotics", "can", "motor", "control", "joint", "giantcrab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/yourusername/giantcrab_joint_api"
Repository = "https://github.com/yourusername/giantcrab_joint_api"

[tool.setuptools]
packages = ["giantcrab_joint_api"]

[tool.setuptools.package-data]
giantcrab_joint_api = ["../lib/x86_64/*.so", "../lib/aarch64/*.so"]
